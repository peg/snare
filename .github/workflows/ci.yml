name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race -count=1

      - name: Test worker
        working-directory: worker
        run: npm test

      - name: Docker Compose smoke test
        run: |
          export SNARE_DASHBOARD_TOKEN=0123456789abcdef0123456789abcdef
          export SNARE_PORT=18080
          docker compose config --quiet
          docker compose -p snare-ci-smoke up -d --build
          trap 'docker compose -p snare-ci-smoke down -v >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:${SNARE_PORT}/health; then
              exit 0
            fi
            sleep 1
          done
          docker compose -p snare-ci-smoke logs
          exit 1

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
