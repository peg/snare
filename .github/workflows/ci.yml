name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Audit worker dependencies
        working-directory: worker
        run: npm audit --audit-level=high

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install GCP canary contract dependencies
        run: |
          python3 -m venv /tmp/snare-canary-lab
          /tmp/snare-canary-lab/bin/python -m pip install \
            google-auth==2.56.2 \
            requests==2.34.2
          echo "/tmp/snare-canary-lab/bin" >> "$GITHUB_PATH"

      - name: Verify real-client canary dependencies
        run: |
          command -v aws
          command -v git
          command -v kubectl
          command -v npm
          command -v ssh

      - name: Test
        env:
          SNARE_CANARY_LAB_STRICT: "1"
        run: go test ./... -v -race -count=1

      - name: Test worker
        working-directory: worker
        run: npm test

      - name: Validate Worker deployment bundle
        working-directory: worker
        run: npm run cf:check

      - name: Docker Compose smoke test
        run: |
          export SNARE_DASHBOARD_TOKEN=0123456789abcdef0123456789abcdef
          export SNARE_ENROLLMENT_TOKEN=abcdef0123456789abcdef0123456789
          export SNARE_PORT=18080
          docker compose config --quiet
          docker compose -p snare-ci-smoke up -d --build
          trap 'docker compose -p snare-ci-smoke down -v >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:${SNARE_PORT}/health; then
              exit 0
            fi
            sleep 1
          done
          docker compose -p snare-ci-smoke logs
          exit 1

      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
