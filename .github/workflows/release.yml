name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install GCP canary contract dependencies
        run: |
          python3 -m venv /tmp/snare-canary-lab
          /tmp/snare-canary-lab/bin/python -m pip install \
            google-auth==2.56.2 \
            requests==2.34.2
          echo "/tmp/snare-canary-lab/bin" >> "$GITHUB_PATH"

      - name: Verify real-client canary dependencies
        run: |
          command -v aws
          command -v git
          command -v kubectl
          command -v npm
          command -v ssh

      - name: Run tests
        env:
          SNARE_CANARY_LAB_STRICT: "1"
        run: go test ./... -race -count=1

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test worker
        working-directory: worker
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run cf:check

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          declare -a targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            SUFFIX="${GOOS}_${GOARCH}"
            echo "Building $SUFFIX..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X main.version=${RELEASE_VERSION}" \
              -o "dist/snare" \
              ./cmd/snare
            if [[ "$target" == "linux/amd64" ]]; then
              test "$(dist/snare --version)" = "snare ${RELEASE_VERSION}"
            fi
            cd dist
            tar -czf "snare_${SUFFIX}.tar.gz" "snare"
            sha256sum "snare_${SUFFIX}.tar.gz" >> checksums.txt
            rm "snare"
            cd ..
          done
          echo "=== checksums.txt ==="
          cat dist/checksums.txt

      - name: Smoke test release archives
        run: |
          for archive in dist/snare_*.tar.gz; do
            tmp="$(mktemp -d)"
            tar -xzf "$archive" -C "$tmp"
            test -x "$tmp/snare"
            rm -rf "$tmp"
          done

      - name: Sign checksums with cosign
        run: cosign sign-blob --yes dist/checksums.txt --bundle dist/checksums.txt.bundle

      - name: Verify signed checksums
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.bundle
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: false
