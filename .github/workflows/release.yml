name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build binaries
        run: |
          mkdir -p dist
          declare -a targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            SUFFIX="${GOOS}_${GOARCH}"
            echo "Building $SUFFIX..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o "dist/snare_${SUFFIX}" \
              ./cmd/snare
            cd dist
            tar -czf "snare_${SUFFIX}.tar.gz" "snare_${SUFFIX}"
            sha256sum "snare_${SUFFIX}.tar.gz" >> checksums.txt
            rm "snare_${SUFFIX}"
            cd ..
          done
          echo "=== checksums.txt ==="
          cat dist/checksums.txt

      - name: Sign checksums with cosign
        run: cosign sign-blob --yes dist/checksums.txt --bundle dist/checksums.txt.bundle

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.bundle
          generate_release_notes: true
          fail_on_unmatched_files: false
