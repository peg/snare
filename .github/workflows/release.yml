name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test worker
        working-directory: worker
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run cf:check

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          declare -a targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            SUFFIX="${GOOS}_${GOARCH}"
            echo "Building $SUFFIX..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X main.version=${RELEASE_VERSION}" \
              -o "dist/snare" \
              ./cmd/snare
            cd dist
            tar -czf "snare_${SUFFIX}.tar.gz" "snare"
            sha256sum "snare_${SUFFIX}.tar.gz" >> checksums.txt
            rm "snare"
            cd ..
          done
          echo "=== checksums.txt ==="
          cat dist/checksums.txt

      - name: Smoke test release archives
        run: |
          for archive in dist/snare_*.tar.gz; do
            tmp="$(mktemp -d)"
            tar -xzf "$archive" -C "$tmp"
            test -x "$tmp/snare"
            rm -rf "$tmp"
          done

      - name: Sign checksums with cosign
        run: cosign sign-blob --yes dist/checksums.txt --bundle dist/checksums.txt.bundle

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.bundle
          generate_release_notes: true
          fail_on_unmatched_files: false
