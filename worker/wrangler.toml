name = "snare-callback"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = false
# account_id is set via CLOUDFLARE_ACCOUNT_ID env var — not committed

routes = [
  { pattern = "snare.sh/c/*", zone_name = "snare.sh" },
  { pattern = "snare.sh/api/*", zone_name = "snare.sh" },
  { pattern = "snare.sh/health", zone_name = "snare.sh" },
]

[[kv_namespaces]]
binding = "SNARE_KV"
id = "a8acd39e2d1b4545b8d3afc0e17d3432"

# Secrets (never commit — set via wrangler secret put):
#   WEBHOOK_URLS  → comma-separated alert destinations
